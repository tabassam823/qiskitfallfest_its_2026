<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#142145" />
      <stop offset="60%" stop-color="#070c1e" />
      <stop offset="100%" stop-color="#02050e" />
    </radialGradient>
    
    <!-- Neon Ring Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7EB6" />
      <stop offset="35%" stop-color="#8A3FFC" />
      <stop offset="70%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Paths -->
    <path id="topTextArc" d="M 62 200 A 138 138 0 1 1 338 200" fill="none" />
    <path id="bottomTextArc" d="M 338 200 A 138 138 0 0 1 62 200" fill="none" />
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="200" cy="200" r="186" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 4" />
  <circle cx="200" cy="200" r="176" stroke="url(#ringGrad)" stroke-width="4" filter="url(#neonGlow)" />
  
  <!-- Outer Badge Disc -->
  <circle cx="200" cy="200" r="170" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2" />

  <!-- Inner Circuit Grid Background -->
  <g opacity="0.2">
    <circle cx="200" cy="200" r="145" stroke="#00A3FF" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="200" cy="200" r="115" stroke="#8A3FFC" stroke-width="1" />
    <line x1="200" y1="30" x2="200" y2="370" stroke="#00A3FF" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="30" y1="200" x2="370" y2="200" stroke="#00A3FF" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="80" y1="80" x2="320" y2="320" stroke="#FF7EB6" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="80" y1="320" x2="320" y2="80" stroke="#FF7EB6" stroke-width="0.5" stroke-dasharray="4 4" />
  </g>

  <!-- Circular Outer Text: QISKIT FALL FEST -->
  <text fill="#FFFFFF" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-weight="900" font-size="20" letter-spacing="5" filter="url(#softGlow)">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      ✦ QISKIT FALL FEST ✦
    </textPath>
  </text>

  <!-- Circular Bottom Text: 2026 • ITS SURABAYA -->
  <text fill="#00E5FF" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="4.5" filter="url(#softGlow)">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ★ 2026 • ITS SURABAYA ★
    </textPath>
  </text>

  <!-- Inner Glow Circle -->
  <circle cx="200" cy="200" r="96" fill="#080f26" stroke="url(#ringGrad)" stroke-width="3" filter="url(#softGlow)" />
  <circle cx="200" cy="200" r="92" fill="#050a1c" />

  <!-- Center Quantum Sphere / Qiskit Core -->
  <!-- Outer Quantum Ring -->
  <circle cx="200" cy="200" r="62" stroke="#FF7EB6" stroke-width="3" stroke-dasharray="14 6" opacity="0.9" />
  
  <!-- Quantum Ellipses (Orbitals / Bloch Sphere) -->
  <ellipse cx="200" cy="200" rx="60" ry="24" stroke="#00A3FF" stroke-width="2.5" transform="rotate(-30 200 200)" opacity="0.9" filter="url(#softGlow)" />
  <ellipse cx="200" cy="200" rx="60" ry="24" stroke="#8A3FFC" stroke-width="2.5" transform="rotate(30 200 200)" opacity="0.9" filter="url(#softGlow)" />
  <ellipse cx="200" cy="200" rx="60" ry="20" stroke="#FF7EB6" stroke-width="2" transform="rotate(90 200 200)" opacity="0.8" />

  <!-- Entanglement Axis Line -->
  <line x1="155" y1="245" x2="245" y2="155" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)" />
  
  <!-- Center Core Pulsing Qubit -->
  <circle cx="200" cy="200" r="14" fill="url(#ringGrad)" filter="url(#neonGlow)" />
  <circle cx="200" cy="200" r="8" fill="#FFFFFF" />

  <!-- Orbiting Qubit Nodes -->
  <circle cx="155" cy="245" r="7" fill="#00E5FF" filter="url(#neonGlow)" />
  <circle cx="155" cy="245" r="3" fill="#FFFFFF" />
  
  <circle cx="245" cy="155" r="7" fill="#FF7EB6" filter="url(#neonGlow)" />
  <circle cx="245" cy="155" r="3" fill="#FFFFFF" />

  <circle cx="200" cy="138" r="5" fill="#FFD700" filter="url(#softGlow)" />
  <circle cx="200" cy="262" r="5" fill="#8A3FFC" filter="url(#softGlow)" />
  <circle cx="140" cy="200" r="5" fill="#00A3FF" filter="url(#softGlow)" />
  <circle cx="260" cy="200" r="5" fill="#FF7EB6" filter="url(#softGlow)" />

  <!-- Year 2026 Center-Bottom Accent Pill -->
  <g transform="translate(145, 268)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#013880" stroke="#00A3FF" stroke-width="1.5" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-weight="900" font-size="13" letter-spacing="2" text-anchor="middle">ITS • 2026</text>
  </g>

  <!-- Side Accent Stars -->
  <g fill="#FFD700" filter="url(#softGlow)">
    <polygon points="42,200 45,206 52,207 47,212 48,219 42,215 36,219 37,212 32,207 39,206" />
    <polygon points="358,200 361,206 368,207 363,212 364,219 358,215 352,219 353,212 348,207 355,206" />
  </g>
</svg>
